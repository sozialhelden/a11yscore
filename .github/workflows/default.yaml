name: ci
on:
  pull_request:
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: cp .env.ci .env
      - uses: hoverkraft-tech/compose-action@ee6af68587292d72db67743171809c19787df4c9 # v3.1.0
        with:
          compose-file: ./docker-compose.ci.yml
      - run: ./docker/wait-for-healthy-server-container.sh
      # we don't ship dev node_modules in the image, so we need to install them here
      - run: docker compose exec server npm ci
      - run: docker compose exec server npm run test:unit
      - run: docker compose exec server npm run test:e2e


